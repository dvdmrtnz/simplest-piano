<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P Messaging</title>
    <style>
        body { font-family: Arial, sans-serif; }
        textarea { width: 100%; height: 80px; }
        #messages { margin-top: 20px; background: #f4f4f4; padding: 10px; }
        button { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>WebRTC P2P Messaging</h1>

    <!-- Signaling -->
    <h3>Signaling Data (for manual exchange)</h3>
    <textarea id="localOffer" placeholder="Offer will appear here..."></textarea>
    <button id="createOffer">Create Offer</button>
    
    <textarea id="remoteOffer" placeholder="Paste the remote offer or answer here..."></textarea>
    <button id="setRemoteOffer">Set Remote Offer/Answer</button>

    <!-- Messaging -->
    <h3>Messaging</h3>
    <textarea id="messageInput" placeholder="Type a message..."></textarea>
    <button id="sendMessage">Send Message</button>
    
    <div id="messages"></div>

    <script>
        let peerConnection;
        let dataChannel;

        // STUN servers (to help with NAT traversal)
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        };

        // Initialize Peer Connection
        function initializePeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);

            // ICE Candidate handling
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log('New ICE candidate:', event.candidate);
                }
            };

            // Handling incoming data channel
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;

                // Message received handler
                dataChannel.onmessage = (event) => {
                    const messageBox = document.getElementById('messages');
                    messageBox.innerHTML += `<p><strong>Peer:</strong> ${event.data}</p>`;
                };

                // Data channel opened handler
                dataChannel.onopen = () => {
                    console.log("Data channel is open!");
                };
            };
        }

        // Create an offer and set it as local description
        document.getElementById('createOffer').onclick = async function () {
            initializePeerConnection();

            // Create a data channel
            dataChannel = peerConnection.createDataChannel("messagingChannel");

            // Setup the message handler for data channel
            dataChannel.onmessage = (event) => {
                const messageBox = document.getElementById('messages');
                messageBox.innerHTML += `<p><strong>Peer:</strong> ${event.data}</p>`;
            };

            // Create and set offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            // Display the offer in the textarea
            document.getElementById('localOffer').value = JSON.stringify(offer);
        };

        // Set the remote offer or answer (based on peer role)
        document.getElementById('setRemoteOffer').onclick = async function () {
            const remoteOffer = document.getElementById('remoteOffer').value;
            if (!remoteOffer) return;

            const remoteDescription = new RTCSessionDescription(JSON.parse(remoteOffer));

            await peerConnection.setRemoteDescription(remoteDescription);

            // If the remote description is an offer, create and send an answer
            if (remoteDescription.type === 'offer') {
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                // Display the answer in the local offer textarea (to send back to peer)
                document.getElementById('localOffer').value = JSON.stringify(answer);
            }
        };

        // Sending a message over the data channel
        document.getElementById('sendMessage').onclick = function () {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value;
            if (message && dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(message);
                document.getElementById('messages').innerHTML += `<p><strong>You:</strong> ${message}</p>`;
                messageInput.value = '';
            } else {
                console.log('Data channel not open or no message typed.');
            }
        };

        // When the remote peer sets ICE candidates
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                console.log("ICE Candidate", event.candidate);
            }
        };
    </script>
</body>
</html>
