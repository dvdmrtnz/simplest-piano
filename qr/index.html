<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Reader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        video {
            width: 100%;
            max-width: 600px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>QR Code Reader</h1>

    <!-- Video element to display the camera stream -->
    <video id="video" autoplay></video>

    <!-- Div to display the scanned QR code result -->
    <div class="result" id="result">Waiting for QR code scan...</div>

    <!-- Include the qr-scanner library -->
    <script type="module">
        import QrScanner from "https://unpkg.com/qr-scanner/qr-scanner.min.js";

        // Select the video element and the result display div
        const video = document.getElementById('video');
        const resultDiv = document.getElementById('result');

        // Request the camera stream using getUserMedia
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;  // Set the video source to the camera stream

                // Create a QrScanner instance and start scanning
                const qrScanner = new QrScanner(video, result => {
                    console.log('QR Code Scanned: ', result);
                    resultDiv.innerHTML = `QR Code: <strong>${result}</strong>`;  // Display the result in the result div
                    qrScanner.stop();  // Stop the scanner after detecting a QR code (optional)
                });

                // Start scanning when the video starts playing
                video.onloadedmetadata = () => qrScanner.start();
            } catch (error) {
                console.error('Error accessing the camera', error);
                resultDiv.innerHTML = 'Error: Unable to access the camera.';
            }
        }

        // Initialize the camera and scanner
        startCamera();
    </script>

</body>
</html>
